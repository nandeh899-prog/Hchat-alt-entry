name: theme-999-test

# 999（MultiApp / ColorOS 分身）专用测试构建：
# 1) 用仓库 secrets 里的真实 keystore 签名（CN=Hchat Release），
#    与 999 内已装的 com.aeonlab.toolkit.coexist 保持同一签名主体，可直接 pm install -r 覆盖安装，
#    不会触发卸载，也就不会重置 LSPosed 的模块启用与作用域。
# 2) applicationId 固定带 .coexist 后缀，避免与主空间正式包冲突（主空间那套禁止触碰）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 platform 37 / build-tools 36
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          CMDLINE=$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)
          echo "cmdline-tools: $CMDLINE"
          yes | "$CMDLINE/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$CMDLINE/sdkmanager" --install "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
          if [ ! -d "$SDK/platforms/android-37" ] && [ -d "$SDK/platforms/android-37.0" ]; then
            mv "$SDK/platforms/android-37.0" "$SDK/platforms/android-37"
          fi
          if grep -q "^AndroidVersion.ApiLevel=" "$SDK/platforms/android-37/source.properties"; then
            sed -i 's/^AndroidVersion.ApiLevel=.*/AndroidVersion.ApiLevel=37/' "$SDK/platforms/android-37/source.properties"
          else
            echo "AndroidVersion.ApiLevel=37" >> "$SDK/platforms/android-37/source.properties"
          fi
          grep -E "AndroidVersion.ApiLevel|Pkg.Desc" "$SDK/platforms/android-37/source.properties"
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: 还原正式签名证书
        env:
          HCAT_KEYSTORE_BASE64: ${{ secrets.HCAT_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$HCAT_KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret: HCAT_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p app/keystore
          echo "$HCAT_KEYSTORE_BASE64" | base64 -d > "app/keystore/。。.jks"

      - name: 编译 release（关 R8，999 测试通道）
        env:
          HCAT_VERSION_CODE: ${{ github.run_number }}
          HCAT_VERSION_NAME: '5.5.103.${{ github.run_number }}-theme'
          HCAT_APP_ID_SUFFIX: '.coexist'
          HCAT_MINIFY: 'false'
          HCAT_APK_NAME: 'Toolbox-coexist-test-signed.apk'
          HCAT_STORE_PASSWORD: ${{ secrets.HCAT_STORE_PASSWORD }}
          HCAT_KEY_ALIAS: ${{ secrets.HCAT_KEY_ALIAS }}
          HCAT_KEY_PASSWORD: ${{ secrets.HCAT_KEY_PASSWORD }}
          GRADLE_OPTS: '-Dorg.gradle.daemon=false'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x lintVitalRelease --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Dkotlin.compiler.execution.strategy=in-process --max-workers=1

      - name: 校验产物签名与包名
        run: |
          set -e
          APK=$(ls dist/*.apk | head -1)
          echo "APK=$APK"
          keytool -printcert -jarfile "$APK" | grep -E 'Owner|SHA256' | head -3

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Toolbox-coexist-test
          path: dist/*.apk
          if-no-files-found: error
